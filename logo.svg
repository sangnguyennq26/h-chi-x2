<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E4B7"/>
      <stop offset="50%" stop-color="#D5A437"/>
      <stop offset="100%" stop-color="#9A6F1A"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D1C20"/>
      <stop offset="100%" stop-color="#701419"/>
    </linearGradient>
  </defs>

  <!-- Passport Stamp Shape: Rounded Octagon / Scalloped Seal -->
  <circle cx="60" cy="60" r="56" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="60" cy="60" r="51" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 2" opacity="0.8"/>
  <circle cx="60" cy="60" r="47" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9"/>

  <!-- Dong Son Radiating Sun Center -->
  <g transform="translate(60,60) scale(0.35)" fill="url(#goldGrad)" opacity="0.35">
    <polygon points="0,-70 10,-25 -10,-25"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(30)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(60)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(90)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(120)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(150)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(180)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(210)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(240)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(270)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(300)"/>
    <polygon points="0,-70 10,-25 -10,-25" transform="rotate(330)"/>
  </g>

  <!-- Flying Chim Lac Bird Silhouette in Gold -->
  <path d="M 32,68 C 36,65 42,60 50,56 C 58,52 66,48 76,46 C 84,44 92,44 96,43 C 94,46 88,49 82,52 C 75,55 70,58 64,62 C 58,66 50,71 42,73 C 37,74 33,72 32,68 Z" fill="url(#goldGrad)"/>
  <!-- Wing Feather Details -->
  <path d="M 54,55 C 60,42 68,34 78,28 C 76,33 72,40 68,48 C 65,51 61,54 54,55 Z" fill="url(#goldGrad)"/>
  <path d="M 64,50 C 70,39 77,32 86,29 C 83,34 80,41 76,47 C 73,49 69,50 64,50 Z" fill="url(#goldGrad)" opacity="0.8"/>
  <!-- Long Bird Crest / Beak -->
  <path d="M 28,68 C 24,67 21,66 18,65 C 22,63 26,64 30,66 Z" fill="url(#goldGrad)"/>
  <!-- Bird Tail Plumage -->
  <path d="M 78,66 C 88,71 96,78 102,86 C 94,84 86,79 77,72 Z" fill="url(#goldGrad)"/>
  <path d="M 72,68 C 80,75 88,82 92,90 C 86,87 80,81 72,74 Z" fill="url(#goldGrad)" opacity="0.7"/>

  <!-- Subtle Star Accent -->
  <circle cx="60" cy="60" r="3" fill="#FFF" opacity="0.9"/>
</svg>
