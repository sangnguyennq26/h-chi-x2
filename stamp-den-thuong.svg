<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Dấu Son Đền Thượng - Đỉnh Nghĩa Lĩnh -->
  <defs>
    <filter id="inkBleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#inkBleed)">
    <!-- Scalloped gear / stamp outer ring -->
    <circle cx="80" cy="80" r="74" stroke="#9D1C20" stroke-width="3.5" fill="none"/>
    <circle cx="80" cy="80" r="66" stroke="#9D1C20" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    <circle cx="80" cy="80" r="60" stroke="#9D1C20" stroke-width="1" fill="none"/>

    <path id="topArch" d="M 24,80 A 56,56 0 0,1 136,80" fill="none"/>
    <path id="bottomArch" d="M 136,80 A 56,56 0 0,1 24,80" fill="none"/>

    <text font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="900" letter-spacing="1.5" fill="#9D1C20">
      <textPath href="#topArch" startOffset="50%" text-anchor="middle">
        ĐỀN THƯỢNG • KÍNH THIÊN LĨNH ĐIỆN
      </textPath>
    </text>

    <text font-family="'Be Vietnam Pro', sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#9D1C20">
      <textPath href="#bottomArch" startOffset="50%" text-anchor="middle">
        ★ ĐỈNH NÚI NGHĨA LĨNH ★
      </textPath>
    </text>

    <!-- Mountain & Sun graphic -->
    <path d="M 50,88 L 80,58 L 110,88 Z" stroke="#9D1C20" stroke-width="2" fill="none"/>
    <path d="M 68,88 L 80,72 L 92,88 Z" stroke="#9D1C20" stroke-width="1.5" fill="none"/>
    <circle cx="80" cy="50" r="5" fill="#9D1C20"/>

    <!-- Seal Box -->
    <rect x="36" y="94" width="88" height="18" rx="2" fill="#9D1C20"/>
    <text x="80" y="107" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="1.5">
      ĐÃ KHÁM PHÁ
    </text>
  </g>
</svg>
